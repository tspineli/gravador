name: Gravador
options:
  bundleIdPrefix: com.tiagospineli
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  developmentLanguage: pt-BR

packages:
  WhisperKit:
    url: https://github.com/argmaxinc/argmax-oss-swift.git
    exactVersion: 1.1.1
  GravadorCore:
    path: Packages/GravadorCore

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    DEVELOPMENT_TEAM: U3VK57TBJA
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Apple Development"
    PROVISIONING_PROFILE_SPECIFIER: ""

targets:
  Gravador:
    type: application
    platform: macOS
    sources:
      - path: Gravador
        excludes:
          - Resources/Info.plist
          - Resources/Gravador.entitlements
    dependencies:
      - package: WhisperKit
        product: WhisperKit
      - package: GravadorCore
    info:
      path: Gravador/Resources/Info.plist
      properties:
        CFBundleDisplayName: Gravador de Reuniões
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.productivity
        LSUIElement: true
        NSMicrophoneUsageDescription: O Gravador usa o microfone para gravar e transcrever a sua fala nas reuniões. Tudo fica no seu Mac.
        NSAudioCaptureUsageDescription: O Gravador captura o áudio do sistema para gravar e transcrever o que os outros participantes falam. Tudo fica no seu Mac.
        NSHumanReadableCopyright: Uso pessoal.
    entitlements:
      path: Gravador/Resources/Gravador.entitlements
      properties:
        # Sandbox SEM com.apple.security.network.client/server: o macOS bloqueia qualquer conexão.
        com.apple.security.app-sandbox: true
        com.apple.security.device.audio-input: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tiagospineli.gravador
        PRODUCT_NAME: Gravador
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_KEY_LSUIElement: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        SWIFT_STRICT_CONCURRENCY: minimal
